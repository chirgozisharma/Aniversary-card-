<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Chirkut ❤️</title>
<style>
body{margin:0;background:#ffe6f0;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Arial';}
.scan-card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center;max-width:350px;}
.scan-card h1{color:#ff4d88;margin-bottom:10px;}
.scan-card p{color:#555;margin-bottom:20px;}
.scan-card img{width:250px;height:250px;border:5px solid #ff4d88;border-radius:15px;}
.scan-card .note{margin-top:15px;font-size:14px;color:#ff4d88;font-weight:bold;}
.card{display:none;padding:20px;text-align:center;}
.card h2{color:#ff4d88;}
.card .date-box{margin:20px;padding:15px;background:#ffe6f0;border-radius:15px;font-size:18px;font-weight:bold;color:#d63384;}
.card .gallery img{width:100px;height:100px;object-fit:cover;border-radius:10px;margin:5px;border:2px solid #ff4d88;}
</style>
</head>
<body>
<div class="scan-card">
<h1>Scan Me <3</h1>
<p>Apne #chirkut ke liye ek surprise</p>
<img src="qr.png" alt="QR Code">
<p class="note">Phone se scan karo ❤️</p>
</div>

<div class="card">
<h2>Happy Anniversary My Chirkut! ❤️</h2>
<p>Will you go on a date with me?</p>
<div class="date-box">
Date: 31.07.26
</div>
<audio controls autoplay loop><source src="song.mp3" type="audio/mpeg"></audio>
<div class="gallery">
<img src="pic1.jpg"><img src="pic2.jpg"><img src="pic3.jpg"><img src="pic4.jpg">
<img src="pic5.jpg"><img src="pic6.jpg"><img src="pic7.jpg"><img src="pic8.jpg">
</div>
</div>
</body>
</html>
